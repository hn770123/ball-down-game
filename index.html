<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Suika-style Game</title>
    <!-- iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Suika-style Game">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <!-- Matter.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 全体をラップし、9:16のアスペクト比を維持するためのコンテナ -->
    <div id="game-wrapper">
        <!-- 上部のUI（スコア、Nextボール表示など） -->
        <header id="game-header">
            <div class="score-container">
                <span class="label">SCORE</span>
                <span id="score">0</span>
            </div>
        </header>

        <!-- ゲーム本体（キャンバス等を描画する領域） -->
        <main id="game-container">
            <!-- デッドライン（ゲームオーバーの基準線） -->
            <div id="deadline-line"></div>
        </main>

        <!-- スタート画面（オーバーレイ） -->
        <div id="game-start-overlay">
            <div class="game-start-content">
                <h2>合体パズル</h2>
                <p>ボールを掴んで動かそう！<br>自動で落ちてくるボールをうまく合体させてね。</p>
                <button id="start-button">ゲーム開始</button>
            </div>
        </div>

        <!-- ゲームオーバー画面（オーバーレイ） -->
        <div id="game-over-overlay" style="display: none;">
            <div class="game-over-content">
                <h2>Game Over</h2>
                <button id="restart-button">リスタート</button>
            </div>
        </div>
    </div>

    <!-- メインのスクリプト -->
    <script src="main.js"></script>
</body>
</html>
